<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jessica Douthit | Portfolio</title>

  <!-- React and Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind CSS -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />

  <style>
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    html, body {
      margin: 0;
      height: 100%;
    }

    #root {
      height: 100vh;
      background: linear-gradient(270deg, #a855f7, #ec4899, #ef4444);
      background-size: 600% 600%;
      animation: gradientShift 15s ease infinite;
      overflow: auto;
    }

    .edu-box {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 1rem;
      transition: background 0.2s;
    }
    .edu-box:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .photo-grid img {
      object-fit: cover;
      width: 100%;
      height: 100%;
      border-radius: 0.75rem;
      display: block;
    }

    .logo-placeholder {
      width: 56px;
      height: 56px;
      min-width: 56px;
      border-radius: 0.5rem;
      background: rgba(255,255,255,0.15);
      border: 2px dashed rgba(255,255,255,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: rgba(255,255,255,0.6);
      text-align: center;
      overflow: hidden;
    }
    .logo-placeholder img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 0.4rem;
    }

    .section-label {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const experiences = [
      {
        title: "Applications Services Intern",
        company: "Johns Hopkins Applied Physics Laboratory",
        location: "Laurel, Maryland",
        duration: "January May 2026 – Present",
        description: [
          "Design software as directed and collaborate with fellow members of the IAS Applications Group on the reconstruction of APL's software system"
        ],
        skills: ["Python", "React.js", "Java"]
      },
      {
        title: "Data Analyst",
        company: "Berea College Health & Human Performance",
        location: "Berea, KY",
        duration: "Aug 2024 – May 2026",
        description: [
          "Led data cleaning, statistical analysis, and visualization for two high-impact human performance studies—bombsuit operator functionality and deadlift biomechanics—using R and Python on datasets exceeding 50,000 observations.",
          "Engineered a robust data collection platform to streamline and error-proof research assistant workflows during trials involving Biodex and VALD ForceDecks equipment.",
          "Developed over 20 interactive R Shiny applications to communicate complex analysis outcomes to stakeholders in real-time.",
          "Designed and deployed 10 full-stack web applications (JavaScript, React, HTML/CSS), including a participant sign-up portal for the URCPP bombsuit research study.",
        ],
        skills: ["Python", "R", "Javascript", "HTML/CSS", "React.js", "Node.js", "Statistics", "Data Engineering", "Data Visualisation"]
      },
      {
        title: "Data Science Intern",
        company: "Virginia Tech DSPG Program",
        location: "Blacksburg, VA",
        duration: "May 2024 – Aug 2024",
        description: [
          "Cleaned dataset containing over 23,000 observations via, and utilized ArcGIS to measure distance between each observation and the solar facility",
          "Built a distance-decay hedonic model, conducted a heterogeneity analysis and an events study to verify the results",
          "Developed an R Shiny web app to visualise results to stakeholders, co-authored an academic paper currently undergoing peer-review",
        ],
        skills: ["R", "ArcGIS", "Statistics", "Data Engineering", "Data Visualisation", "R Shiny", "Leaflet", "GG Plot"]
      }
    ];

    function ExperienceSection({ onBack }) {
      const [selectedIndex, setSelectedIndex] = React.useState(0);
      const selectedExperience = experiences[selectedIndex];

      return (
        <div className="flex flex-col w-full h-full p-8">
          <button onClick={onBack} className="self-start mb-4 px-4 py-2 bg-white text-purple-700 font-semibold rounded shadow hover:bg-purple-100 transition">
            ← Back
          </button>
          <div className="flex flex-col md:flex-row w-full h-full">
            <div className="md:w-1/2 flex flex-col space-y-4">
              {experiences.map((exp, index) => (
                <div
                  key={index}
                  onClick={() => setSelectedIndex(index)}
                  className={`p-4 rounded-lg cursor-pointer transition transform hover:scale-105 shadow-lg ${
                    selectedIndex === index ? "bg-purple-600 text-white" : "bg-white text-black"
                  }`}
                >
                  <h3 className="text-xl font-semibold">{exp.title}</h3>
                  <p className="text-sm">{exp.company} | {exp.location}</p>
                  <p className="text-sm italic">{exp.duration}</p>
                  <ul className="list-disc list-inside mt-2">
                    {exp.description.map((item, idx) => (
                      <li key={idx} className="text-sm">{item}</li>
                    ))}
                  </ul>
                </div>
              ))}
            </div>
            <div className="md:w-1/2 mt-6 md:mt-0 md:ml-8">
              <h3 className="text-2xl font-bold mb-4 text-white">Skills Used</h3>
              <div className="flex flex-wrap gap-4 mb-6">
                {selectedExperience.skills.map((skill, idx) => (
                  <div
                    key={idx}
                    className="w-28 h-28 flex items-center justify-center bg-purple-200 text-purple-900 font-semibold text-center text-sm rounded-full shadow-md transition-transform duration-200 transform hover:scale-110"
                  >
                    {skill}
                  </div>
                ))}
              </div>
              {selectedExperience.title === "Data Science Intern" && selectedExperience.company.includes("Virginia Tech") && (
                <div className="flex flex-col space-y-4">
                  <a
                    href="https://aaec.vt.edu/academics/undergraduate/dspg/team/2024.html"
                    target="_blank"
                    rel="noopener noreferrer"
                    className="px-4 py-2 bg-white text-purple-700 font-semibold rounded shadow hover:bg-purple-100 transition text-center"
                  >
                    See more on Virginia Tech's website
                  </a>
                  <a
                    href="https://aaec-vt.shinyapps.io/dspg24PrinceGeorge/"
                    target="_blank"
                    rel="noopener noreferrer"
                    className="px-4 py-2 bg-white text-purple-700 font-semibold rounded shadow hover:bg-purple-100 transition text-center"
                  >
                    See my R Shiny Web App
                  </a>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function DataManagerProjects({ onBack }) {
      const projects = [
        {
          title: "Yoga Pose Visualisation Tool",
          description: "A review tool for the yoga class at Berea College.",
          link: "https://jessicadouthit00.github.io/yoga/"
        },
        {
          title: "Preliminary Data Analysis",
          description: "Preliminary data analysis done for faculty research on the physics of deadlifts.",
          link: "https://jessica-douthit-0.shinyapps.io/preliminary/"
        },
        {
          title: "Wellness Data Dashboard",
          description: "Berea College's Department of Health and Human Performance recently consolidated two half-credit classes (Wellness 101 and Wellness 102) into a full-credit class, Wellness 150. After scraping the data from Moodle, I analyzed it via R to see if consolidation had an impact on student grades.",
          link: "https://jessica-douthit-0.shinyapps.io/wellness/"
        },
        {
          title: "Research Portal",
          description: "This website allows potential subjects to sign up to participate in an ongoing URCPP catered to improve functionality and ease of movement for Bombsuit Operators.",
          link: "https://jessicadouthit00.github.io/hhpresearch1/"
        },
        {
          title: "FMS & RPE Analysis and Visualisation: Final Version",
          description: "This visualises the results of our analysis for URCPP 799, and includes bar charts and overlapping bubble graphs.",
          link: "https://jessica-douthit-0.shinyapps.io/StarExcursionTest/"
        },
        {
          title: "FMS & RPE Analysis & Visualization: Preliminary Version",
          description: "Interactive visualization tool for Functional Movement Screen and Rate of Perceived Exertion data analysis.",
          link: "https://jessicadouthit00.github.io/fmsrpe-visualization/"
        },
        {
          title: "URCPP 799 Project",
          description: "An alternative visualisation and summary of the same study, designed for a presentation at Eastern Kentucky University.",
          link: "https://jessicadouthit00.github.io/799/"
        },
        {
          title: "VO2 Device Comparison Study",
          description: "A website depicting the preliminary results of Dr. Mortara's research on the efficacy of different VO2 measurement devices.",
          link: "https://jessicadouthit00.github.io/VO2/"
        },
        {
          title: "Deadlift Systematic Review",
          description: "A systematic review of an incomplete dataset meant to determine the number of additional subjects needed to render the study viable.",
          link: "https://jessicadouthit00.github.io/DeadliftReview/"
        }
      ];

      return (
        <div className="h-full w-full p-6 text-white">
          <button
            onClick={onBack}
            className="mb-6 px-4 py-2 bg-white text-purple-700 font-semibold rounded shadow hover:bg-purple-100 transition"
          >
            ← Back
          </button>
          <h2 className="text-3xl font-bold mb-10 text-center">Examples of Work</h2>
          <p>*Due to FERPA and other privacy laws, the majority of my work as a Data Analyst is available only to Berea College Faculty</p>
          <div className="flex flex-col space-y-6 mt-6">
            {projects.map((project, index) => (
              <div
                key={index}
                className="flex flex-col md:flex-row items-start md:items-center space-y-4 md:space-y-0 md:space-x-6"
              >
                <a
                  href={project.link}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="w-28 h-28 flex items-center justify-center rounded-full bg-black hover:bg-gray-700 text-white font-semibold text-center text-sm shadow-md transition-transform transform hover:scale-105"
                >
                  Project {index + 1}
                </a>
                <div className="max-w-prose">
                  <h3 className="text-xl font-bold mb-1">{project.title}</h3>
                  <p className="text-sm text-white">{project.description}</p>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function PersonalProjects({ onBack }) {
      return (
        <div className="h-full w-full p-6 text-white">
          <button
            onClick={onBack}
            className="mb-6 px-4 py-2 bg-white text-purple-700 font-semibold rounded shadow hover:bg-purple-100 transition"
          >
            ← Back
          </button>
          <h2 className="text-3xl font-bold mb-10 text-center">Personal Projects</h2>
          <div className="flex flex-col md:flex-row justify-center items-center gap-8">
            <a
              href="https://github.com/JessicaDouthit00/C-Compiler"
              target="_blank"
              rel="noopener noreferrer"
              className="w-64 h-64 rounded-lg bg-black hover:bg-gray-700 cursor-pointer transition transform hover:scale-105 shadow-lg flex items-center justify-center text-center text-lg font-semibold p-4"
            >
              A small compiler for the C language
            </a>
            <a
              href="https://jessicadouthit00.github.io/personaltraining/"
              target="_blank"
              rel="noopener noreferrer"
              className="w-64 h-64 rounded-lg bg-black hover:bg-gray-700 cursor-pointer transition transform hover:scale-105 shadow-lg flex items-center justify-center text-center text-lg font-semibold p-4"
            >
              My Personal Training Website
            </a>
            <a
              href="https://jessicadouthit00.github.io/womensclub/"
              target="_blank"
              rel="noopener noreferrer"
              className="w-64 h-64 rounded-lg bg-black hover:bg-gray-700 cursor-pointer transition transform hover:scale-105 shadow-lg flex items-center justify-center text-center text-lg font-semibold p-4"
            >
              Berea Women's Club
            </a>
            <a
              href="https://www.youtube.com/watch?v=fyvA-8-e-CM"
              target="_blank"
              rel="noopener noreferrer"
              className="w-64 h-64 rounded-lg bg-black hover:bg-gray-700 cursor-pointer transition transform hover:scale-105 shadow-lg flex items-center justify-center text-center text-lg font-semibold p-4"
            >
              Archivus
            </a>
            <a
              href="https://jessicadouthit00.github.io/DRC/"
              target="_blank"
              rel="noopener noreferrer"
              className="w-64 h-64 rounded-lg bg-black hover:bg-gray-700 cursor-pointer transition transform hover:scale-105 shadow-lg flex items-center justify-center text-center text-lg font-semibold p-4"
            >
              Spatial Analysis of DRC Conflict
            </a>
            <a
              href="https://youtu.be/qzmH0izR6J0"
              target="_blank"
              rel="noopener noreferrer"
              className="w-64 h-64 rounded-lg bg-black hover:bg-gray-700 cursor-pointer transition transform hover:scale-105 shadow-lg flex items-center justify-center text-center text-lg font-semibold p-4"
            >
              Lab-Controlled MITM Attack
            </a>
          </div>
        </div>
      );
    }

    /* ─── UPDATED Background & Education Section ─── */
    function BackgroundSection({ onBack }) {
      //paths
      const photos = [
        { src: "images/photo1.jpg", alt: "Photo 1" },
        { src: "images/photo2.jpg", alt: "Photo 2" },
        { src: "images/photo3.jpg", alt: "Photo 3" },
        { src: "images/jessica.jpg", alt: "Photo 4" },
      ];

      const education = [
        {
          logo: "images/jhu-logo.jpg",       
          school: "Johns Hopkins Whiting School of Engineering",
          degree: "Master of Science in Cybersecurity",
          duration: "Fall 2026 – Present",
        },
        {
          logo: "images/berea-logo.jpg",      // replace with your Berea logo path
          school: "Berea College",
          degree: "Bachelor of Science in Computer and Information Science",
          minor: "Double Minor in Philosophy and Law, Ethics, and Society",
          duration: "August 2022 – May 2026",
        },
      ];

      return (
        <div className="w-full min-h-full p-8 text-white">
          <button
            onClick={onBack}
            className="mb-8 px-4 py-2 bg-white text-purple-700 font-semibold rounded shadow hover:bg-purple-100 transition"
          >
            ← Back
          </button>

          {/* ── Background ── */}
          <section className="mb-14">
            <p className="section-label text-white">01</p>
            <h2 className="text-3xl font-bold mb-8">Background</h2>

            <div className="flex flex-col md:flex-row gap-8 items-start">
              {/* 2×2 photo grid */}
              <div
                className="photo-grid flex-shrink-0"
                style={{
                  display: "grid",
                  gridTemplateColumns: "1fr 1fr",
                  gridTemplateRows: "1fr 1fr",
                  gap: "12px",
                  width: "320px",
                  height: "320px",
                }}
              >
                {photos.map((photo, i) => (
                  <div
                    key={i}
                    style={{
                      borderRadius: "0.75rem",
                      overflow: "hidden",
                      background: "rgba(255,255,255,0.12)",
                      border: "2px dashed rgba(255,255,255,0.3)",
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                    }}
                  >
                    <img
                      src={photo.src}
                      alt={photo.alt}
                      style={{ width: "100%", height: "100%", objectFit: "cover", display: "block", borderRadius: "0.65rem" }}
                      onError={(e) => {
                        // show a soft placeholder if image is missing
                        e.target.style.display = "none";
                        e.target.parentNode.innerHTML = `<span style="color:rgba(255,255,255,0.45);font-size:12px;text-align:center;padding:8px;">Photo ${i + 1}</span>`;
                      }}
                    />
                  </div>
                ))}
              </div>

              {/* Paragraph */}
              <div className="flex-1" style={{ maxWidth: "560px" }}>
                <p className="text-white leading-relaxed text-base" style={{ lineHeight: "1.85" }}>
                  I'm a Computer Science graduate from Berea College with a double minor in Philosophy and Law, Ethics, and Society, beginning my Master's in Cybersecurity at Johns Hopkins Whiting School of Engineering in Fall 2026. Originally from Thailand, I moved to the U.S. for college and am fluent in both Thai and English. I specialize in backend development, data analysis, and machine learning, with a strong interest in building full-stack tools that support scientific and educational research. My work blends a solid foundation in statistics and programming with real-world application—particularly through high-impact projects in biomechanics and data visualization. Outside of tech, I'm passionate about running and fitness, and I also work as a personal trainer.
                </p>
              </div>
            </div>
          </section>

          {/* ── Education ── */}
          <section>
            <p className="section-label text-white">02</p>
            <h2 className="text-3xl font-bold mb-8">Education</h2>

            <div className="flex flex-col gap-5" style={{ maxWidth: "640px" }}>
              {education.map((edu, i) => (
                <div key={i} className="edu-box p-5">
                  <div className="flex items-start gap-4">
                    {/* Logo */}
                    <div className="logo-placeholder">
                      <img
                        src={edu.logo}
                        alt={edu.school + " logo"}
                        onError={(e) => {
                          e.target.style.display = "none";
                          e.target.parentNode.innerHTML = `<span style="color:rgba(255,255,255,0.5);font-size:9px;text-align:center;line-height:1.2;padding:4px;">Logo</span>`;
                        }}
                      />
                    </div>

                    {/* Text */}
                    <div className="flex-1">
                      <h3 className="font-bold text-lg leading-snug mb-1">{edu.school}</h3>
                      <p className="text-sm font-medium opacity-90">{edu.degree}</p>
                      {edu.minor && (
                        <p className="text-sm opacity-75 mt-0.5">{edu.minor}</p>
                      )}
                      <p
                        className="text-xs mt-2 font-semibold"
                        style={{
                          background: "rgba(255,255,255,0.15)",
                          display: "inline-block",
                          padding: "2px 10px",
                          borderRadius: "999px",
                          letterSpacing: "0.05em",
                        }}
                      >
                        {edu.duration}
                      </p>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </section>
        </div>
      );
    }

    function ProjectsPage({ onBack }) {
      const [view, setView] = React.useState("main");

      if (view === "dataManager") return <DataManagerProjects onBack={() => setView("main")} />;
      if (view === "personal") return <PersonalProjects onBack={() => setView("main")} />;

      return (
        <div className="h-full flex flex-col items-center justify-center text-white p-6">
          <button onClick={onBack} className="mb-6 px-4 py-2 bg-white text-purple-700 font-semibold rounded shadow hover:bg-purple-100 transition">
            ← Back
          </button>
          <h2 className="text-3xl font-bold mb-10">Projects</h2>
          <div className="flex flex-col md:flex-row gap-8">
            <div
              onClick={() => setView("dataManager")}
              className="w-64 h-64 rounded-lg bg-black hover:bg-gray-700 cursor-pointer transition transform hover:scale-105 shadow-lg flex items-center justify-center text-center text-lg font-semibold p-4"
            >
              Work done as a part of my role as a Data Analyst
            </div>
            <div
              onClick={() => setView("personal")}
              className="w-64 h-64 rounded-lg bg-black hover:bg-gray-700 cursor-pointer transition transform hover:scale-105 shadow-lg flex items-center justify-center text-center text-lg font-semibold p-4"
            >
              Personal Projects
            </div>
          </div>
        </div>
      );
    }

    function PublicationsSection({ onBack }) {
      const citation = "Cary, M., Chen, S., Douthit, J., Jackson, N., McCloud, M., & Rosner, B. (2025). Estimating the heterogeneous effects of a utility-scale solar facility on house prices. Land Use Policy, 159, 107796. https://doi.org/10.1016/j.landusepol.2025.107796";
      const pdfSrc = "Publication.pdf";

      return (
        <div className="w-full min-h-full p-8 text-white">
          <button
            onClick={onBack}
            className="mb-8 px-4 py-2 bg-white text-purple-700 font-semibold rounded shadow hover:bg-purple-100 transition"
          >
            ← Back
          </button>

          <h2 className="text-3xl font-bold mb-10 text-center">Publications</h2>

          {/* Citation card */}
          <div
            style={{
              background: "rgba(255,255,255,0.12)",
              backdropFilter: "blur(10px)",
              border: "1px solid rgba(255,255,255,0.25)",
              borderRadius: "1rem",
              padding: "1.5rem",
              maxWidth: "860px",
              margin: "0 auto 2rem auto",
            }}
          >
            <p
              className="text-xs font-semibold mb-3"
              style={{ letterSpacing: "0.15em", textTransform: "uppercase", opacity: 0.65 }}
            >
              Citation
            </p>
            <p
              className="text-sm leading-relaxed"
              style={{ fontFamily: "Georgia, 'Times New Roman', serif", lineHeight: "1.8" }}
            >
              {citation}
            </p>
          </div>

          {/* Embedded PDF */}
          <div style={{ maxWidth: "860px", margin: "0 auto" }}>
            <p
              className="text-xs font-semibold mb-3"
              style={{ letterSpacing: "0.15em", textTransform: "uppercase", opacity: 0.65 }}
            >
              Full Paper
            </p>
            <div
              style={{
                borderRadius: "1rem",
                overflow: "hidden",
                border: "1px solid rgba(255,255,255,0.25)",
                background: "rgba(0,0,0,0.25)",
              }}
            >
              <iframe
                src={pdfSrc}
                title="Publication PDF"
                width="100%"
                height="700px"
                style={{ display: "block", border: "none" }}
              >
                <p className="text-white p-4">
                  Your browser does not support inline PDFs.{" "}
                  <a href={pdfSrc} className="underline" target="_blank" rel="noopener noreferrer">
                    Download the PDF
                  </a>{" "}
                  to read it.
                </p>
              </iframe>
            </div>
            <div className="mt-4 text-center">
              <a
                href={pdfSrc}
                download
                className="inline-block px-6 py-2 bg-white text-purple-700 font-semibold rounded shadow hover:bg-purple-100 transition text-sm"
              >
                ↓ Download PDF
              </a>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [view, setView] = React.useState("home");

      if (view === "experience") return <ExperienceSection onBack={() => setView("home")} />;
      if (view === "projects") return <ProjectsPage onBack={() => setView("home")} />;
      if (view === "background & education") return <BackgroundSection onBack={() => setView("home")} />;
      if (view === "publications") return <PublicationsSection onBack={() => setView("home")} />;

      return (
        <div className="h-full flex flex-col justify-center items-center text-white text-center px-4">
          <h1 className="text-4xl font-bold mb-10">Jessica Douthit</h1>
          <h1 className="text-4xl font-bold mb-10">Data Analyst</h1>
          <h1 className="text-4xl font-bold mb-10">Portfolio</h1>
          <div className="flex justify-center space-x-12 flex-wrap">
            {["Experience", "Projects", "Background & Education", "Publications"].map((label) => (
              <div
                key={label}
                onClick={() => setView(label.toLowerCase())}
                className="w-36 h-36 rounded-full bg-black cursor-pointer hover:bg-gray-700 transition transform hover:scale-105 shadow-lg flex items-center justify-center text-lg font-semibold m-4"
              >
                {label}
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
