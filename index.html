<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jessica Douthit | Portfolio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --bg: #050d1a;
    --bone: #ffffff;
    --bone2: #e8f0ff;
    --accent: #2a6dd9;
    --accent2: #6aaef5;
    --dim: rgba(255,255,255,0.12);
    --border: rgba(255,255,255,0.18);
    --text-muted: rgba(255,255,255,0.55);
    --serif: 'Cormorant Garamond', Georgia, serif;
    --mono: 'DM Mono', 'Courier New', monospace;
  }

  html, body { margin: 0; height: 100%; }

  @keyframes bgShift {
    0%   { background-color: #000000; }
    14%  { background-color: #050d1a; }
    28%  { background-color: #0d1a35; }
    42%  { background-color: #1a0533; }
    56%  { background-color: #2a0845; }
    70%  { background-color: #0d0a2e; }
    84%  { background-color: #050d1a; }
    100% { background-color: #000000; }
  }

  #root {
    min-height: 100vh;
    background-color: #000000;
    animation: bgShift 24s ease-in-out infinite;
    color: #ffffff;
    font-family: var(--mono);
    overflow-x: hidden;
    overflow-y: auto;
    position: relative;
  }

  #bg-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  #app-root {
    position: relative;
    z-index: 1;
  }

  #root::after {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent2), #a8d4ff, var(--accent2), transparent);
    z-index: 9998;
  }

  @keyframes orb1 {
    0%   { transform: translate(0, 0) scale(1); }
    33%  { transform: translate(60px, -40px) scale(1.08); }
    66%  { transform: translate(-30px, 50px) scale(0.95); }
    100% { transform: translate(0, 0) scale(1); }
  }
  @keyframes orb2 {
    0%   { transform: translate(0, 0) scale(1); }
    40%  { transform: translate(-70px, 60px) scale(1.1); }
    80%  { transform: translate(40px, -30px) scale(0.92); }
    100% { transform: translate(0, 0) scale(1); }
  }
  @keyframes orb3 {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(50px, 40px) scale(1.05); }
    100% { transform: translate(0, 0) scale(1); }
  }

  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    pointer-events: none;
    z-index: 0;
  }
  .orb1 {
    width: 520px; height: 520px;
    top: -120px; left: -100px;
    background: radial-gradient(circle, rgba(30,80,200,0.30) 0%, rgba(80,20,140,0.15) 50%, transparent 70%);
    animation: orb1 18s ease-in-out infinite;
  }
  .orb2 {
    width: 440px; height: 440px;
    bottom: -80px; right: -80px;
    background: radial-gradient(circle, rgba(90,20,160,0.25) 0%, rgba(20,60,160,0.15) 50%, transparent 70%);
    animation: orb2 22s ease-in-out infinite;
  }
  .orb3 {
    width: 300px; height: 300px;
    top: 45%; left: 55%;
    background: radial-gradient(circle, rgba(80,140,255,0.12) 0%, rgba(120,40,180,0.08) 50%, transparent 70%);
    animation: orb3 14s ease-in-out infinite;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .animate { animation: fadeUp 0.55s cubic-bezier(.22,.68,0,1.1) both; }
  .d1 { animation-delay: .05s; }
  .d2 { animation-delay: .15s; }
  .d3 { animation-delay: .25s; }
  .d4 { animation-delay: .35s; }
  .d5 { animation-delay: .45s; }
  .d6 { animation-delay: .55s; }

  @media (prefers-reduced-motion: reduce) {
    #root { animation: none; background-color: #050d1a; }
    .orb { animation: none; }
    .animate { animation: none; }
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 22px;
    border: 1px solid rgba(255,255,255,0.65);
    background: transparent;
    color: var(--bone);
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: background 0.18s, border-color 0.18s;
    margin-bottom: 2.5rem;
  }
  .back-btn:hover, .back-btn:focus-visible {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.95);
  }
  .back-btn:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }

  .sl {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--accent2);
    margin-bottom: 0.6rem;
  }

  .glass {
    background: rgba(255,255,255,0.04);
    border: 0.5px solid var(--border);
    border-radius: 4px;
    transition: background 0.2s, border-color 0.2s;
  }
  .glass:hover {
    background: rgba(255,255,255,0.07);
    border-color: rgba(255,255,255,0.22);
  }

  .skill-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 7px 18px;
    border: 1px solid rgba(106,174,245,0.6);
    background: rgba(42,109,217,0.15);
    color: #ffffff;
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.08em;
    border-radius: 2px;
    transition: background 0.18s, transform 0.15s;
  }
  .skill-pill:hover {
    background: rgba(42,109,217,0.28);
    transform: translateY(-2px);
  }

  .exp-card {
    padding: 1.2rem 1.4rem;
    border: 0.5px solid var(--border);
    background: rgba(255,255,255,0.02);
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.18s, border-color 0.18s;
    position: relative;
  }
  .exp-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: transparent;
    transition: background 0.2s;
  }
  .exp-card.active::before,
  .exp-card:hover::before {
    background: var(--accent2);
  }
  .exp-card.active {
    background: rgba(42,109,217,0.1);
    border-color: rgba(106,174,245,0.4);
  }
  .exp-card:hover {
    background: rgba(255,255,255,0.04);
  }
  .exp-card:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }

  .exp-title { font-family: var(--serif); font-size: 1.2rem; font-weight: 400; color: #ffffff; margin-bottom: 4px; }
  .exp-sub { font-family: var(--mono); font-size: 13px; color: rgba(255,255,255,0.65); letter-spacing: 0.06em; margin-bottom: 8px; }
  .exp-duration { font-family: var(--mono); font-size: 12px; color: var(--accent2); letter-spacing: 0.1em; }
  .exp-list { margin-top: 10px; padding-left: 1.2rem; display: flex; flex-direction: column; gap: 6px; }
  .exp-list li { font-family: var(--mono); font-size: 13px; color: rgba(255,255,255,0.85); line-height: 1.75; letter-spacing: 0.02em; }

  .proj-tile {
    width: 200px;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.6;
    letter-spacing: 0.04em;
    border: 1px solid rgba(255,255,255,0.45);
    background: rgba(255,255,255,0.02);
    border-radius: 3px;
    cursor: pointer;
    text-decoration: none;
    color: var(--bone);
    padding: 1.2rem;
    transition: background 0.18s, border-color 0.18s, transform 0.18s;
  }
  .proj-tile:hover, .proj-tile:focus-visible {
    background: rgba(42,109,217,0.15);
    border-color: rgba(106,174,245,0.7);
    transform: translateY(-4px);
  }
  .proj-tile:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }

  .edu-box {
    padding: 1.4rem 1.6rem;
    border: 0.5px solid var(--border);
    background: rgba(255,255,255,0.03);
    border-radius: 4px;
    transition: background 0.2s;
  }
  .edu-box:hover { background: rgba(255,255,255,0.06); }

  .logo-ph {
    width: 52px;
    height: 52px;
    min-width: 52px;
    border-radius: 3px;
    border: 0.5px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.06);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-ph img { width: 100%; height: 100%; object-fit: contain; }
  .logo-ph span { color: rgba(255,255,255,0.35); font-size: 9px; font-family: var(--mono); }

  .pill-date {
    display: inline-block;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.1em;
    padding: 4px 12px;
    border: 0.5px solid rgba(106,174,245,0.5);
    background: rgba(42,109,217,0.12);
    color: var(--accent2);
    border-radius: 2px;
    margin-top: 8px;
  }

  .photo-cell {
    border-radius: 3px;
    overflow: hidden;
    background: rgba(255,255,255,0.05);
    border: 0.5px solid var(--border);
  }
  .photo-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-cell .ph-fallback { height: 100%; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.25); font-family: var(--mono); font-size: 10px; }

  .link-btn {
    display: block;
    padding: 10px 22px;
    border: 1px solid rgba(255,255,255,0.6);
    background: transparent;
    color: var(--bone);
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-decoration: none;
    text-align: center;
    border-radius: 2px;
    transition: background 0.18s, border-color 0.18s;
  }
  .link-btn:hover, .link-btn:focus-visible {
    background: rgba(255,255,255,0.06);
    border-color: rgba(106,174,245,0.9);
  }
  .link-btn:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }

  .citation-card {
    background: rgba(255,255,255,0.03);
    border: 0.5px solid var(--border);
    border-radius: 4px;
    padding: 1.8rem;
    max-width: 840px;
    margin: 0 auto 2.5rem;
  }

  .page-wrap { min-height: 100vh; padding: 3rem clamp(1.5rem, 5vw, 5rem); }

  .divider { height: 0.5px; background: var(--border); margin: 2.5rem 0; }

  .home-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    max-width: 440px;
    margin: 0 auto;
  }
  @media (min-width: 600px) {
    .home-grid { grid-template-columns: repeat(4, 1fr); max-width: 640px; }
  }

  .nav-tile {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    line-height: 1.6;
    border: 1px solid rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.02);
    cursor: pointer;
    border-radius: 3px;
    padding: 1rem;
    transition: background 0.18s, border-color 0.18s, transform 0.15s;
    color: var(--bone);
  }
  .nav-tile:hover, .nav-tile:focus-visible {
    background: rgba(42,109,217,0.15);
    border-color: rgba(106,174,245,0.7);
    transform: translateY(-3px);
  }
  .nav-tile:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }

  .proj-row { display: flex; flex-direction: column; gap: 1.5rem; }
  @media (min-width: 640px) { .proj-row { flex-direction: row; } }

  .corner-img {
    position: fixed;
    top: 2rem;
    width: 120px;
    height: 120px;
    border-radius: 4px;
    border: 0.5px solid var(--border);
    background: rgba(255,255,255,0.04);
    overflow: hidden;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .corner-img img { width: 100%; height: 100%; object-fit: contain; }
  .corner-img span { color: rgba(255,255,255,0.2); font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; }
  .corner-img-left  { left: 2rem; }
  .corner-img-right { right: 2rem; }

  @media (max-width: 700px) {
    .corner-img { width: 80px; height: 80px; top: 1.2rem; }
    .corner-img-left  { left: 1rem; }
    .corner-img-right { right: 1rem; }
  }

  .row-link {
    display: flex; align-items: center; gap: 1.5rem; padding: 1rem 1.4rem;
    background: rgba(255,255,255,0.02); text-decoration: none; color: #ffffff;
    transition: background 0.15s;
  }
  .row-link:hover, .row-link:focus-visible { background: rgba(42,109,217,0.1); }
  .row-link:focus-visible { outline: 2px solid var(--accent2); outline-offset: -2px; }
  .row-index { font-family: var(--mono); font-size: 12px; color: var(--accent2); min-width: 24px; letter-spacing: 0.1em; }
  .row-title { font-family: var(--serif); font-size: 1.15rem; font-weight: 400; margin-bottom: 3px; }
  .row-desc { font-family: var(--mono); font-size: 12.5px; color: rgba(255,255,255,0.65); line-height: 1.6; }
  .row-arrow { font-family: var(--mono); font-size: 13px; color: rgba(255,255,255,0.5); }

  h1, h2 { margin: 0; }
  a { -webkit-tap-highlight-color: transparent; }
</style>
</head>

  /* ---------------------------------------------------------------- */
  /* Tiny DOM helper                                                   */
  /* ---------------------------------------------------------------- */

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    for (var key in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, key)) continue;
      var val = attrs[key];
      if (key === "class") node.className = val;
      else if (key === "style") node.setAttribute("style", val);
      else if (key === "html") node.innerHTML = val;
      else if (key.indexOf("on") === 0 && typeof val === "function") {
        node.addEventListener(key.slice(2).toLowerCase(), val);
      } else {
        node.setAttribute(key, val);
      }
    }
    children = children || [];
    for (var i = 0; i < children.length; i++) {
      var child = children[i];
      if (child == null) continue;
      if (typeof child === "string") node.appendChild(document.createTextNode(child));
      else node.appendChild(child);
    }
    return node;
  }

  function animDelay(i) {
    var classes = ["d1", "d2", "d3", "d4", "d5", "d6"];
    return classes[Math.min(i, classes.length - 1)];
  }

  function imgWithFallback(src, alt, fallbackText, wrapAttrs) {
    var wrap = el("div", wrapAttrs || {});
    var img = el("img", { src: src, alt: alt });
    img.addEventListener("error", function () {
      wrap.innerHTML = "";
      wrap.appendChild(el("span", {}, [fallbackText]));
    });
    wrap.appendChild(img);
    return wrap;
  }

  /* ---------------------------------------------------------------- */

    state.path = path;
    render();
    window.scrollTo(0, 0);
  }

  function backButton(onBack) {
    return el("button", { class: "back-btn", onClick: onBack }, ["\u2190 Back"]);
  }

  /* Views                                                              */
  /* ---------------------------------------------------------------- */

  function renderHome() {

    });

    wrap.appendChild(imgWithFallback("images/apl.jpg", "APL", "APL", { class: "corner-img corner-img-left animate d2" }));

      style: "font-family:var(--mono);font-size:clamp(0.85rem,1.8vw,1rem);letter-spacing:0.22em;text-transform:uppercase;color:rgba(255,255,255,0.85);margin-bottom:2rem;"
    }, ["Data Analyst & Software Engineer"]));

    wrap.appendChild(el("div", {
      class: "animate d4",
      style: "font-family:var(--serif);font-style:italic;font-size:clamp(1.05rem,2.2vw,1.3rem);font-weight:300;color:rgba(255,255,255,0.75);margin-bottom:0.4rem;"
    }, ["Currently pursuing a M.S. in Cybersecurity at Johns Hopkins Whiting School of Engineering"]));

    wrap.appendChild(el("div", {
      class: "animate d4",
      style: "font-family:var(--serif);font-style:italic;font-size:clamp(1.05rem,2.2vw,1.3rem);font-weight:300;color:rgba(255,255,255,0.75);margin-bottom:0.5rem;"
    }, ["Technical Aide at Johns Hopkins Applied Physics Laboratory"]));

    wrap.appendChild(el("div", {
      class: "animate d5",
      style: "font-family:var(--mono);font-size:clamp(0.75rem,1.2vw,0.85rem);letter-spacing:0.28em;text-transform:uppercase;color:#ffffff;margin-bottom:3.5rem;"
    }, ["Portfolio"]));

    var grid = el("div", { class: "home-grid animate d6" });
    var labels = [
      { label: "Experience", path: ["experience"] },
      { label: "Projects", path: ["projects"] },
      { label: "Background & Education", path: ["background"] },
      { label: "Publications", path: ["publications"] }
    ];
    labels.forEach(function (item) {
      grid.appendChild(el("div", {
        class: "nav-tile",
        tabindex: "0",
        role: "button",
        onClick: function () { navigate(item.path); },
        onKeydown: function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); navigate(item.path); } }
      }, [item.label]));
    });
    wrap.appendChild(grid);

    wrap.appendChild(el("div", { class: "animate d6", style: "width:40px;height:1px;background:var(--border);margin-top:3.5rem;" }));

    return wrap;
  }

  function renderExperience() {
    var selectedIndex = state.expIndex || 0;
    var sel = experiences[selectedIndex];
    var isVT = sel.company.indexOf("Virginia Tech") !== -1;

    var wrap = el("div", { class: "page-wrap" });
    wrap.appendChild(backButton(function () { navigate([]); }));
    wrap.appendChild(el("div", { class: "sl animate d1" }, ["02 / Experience"]));
    wrap.appendChild(el("h2", {
      class: "animate d2",
      style: "font-family:var(--serif);font-size:clamp(1.8rem,4vw,2.6rem);font-weight:300;letter-spacing:0.02em;margin-top:0;margin-bottom:2.5rem;color:#ffffff;"
    }, ["Professional History"]));

    var outer = el("div", { style: "display:flex;flex-direction:column;gap:2.5rem;" });

    var cardsWrap = el("div", { style: "display:flex;flex-direction:column;gap:10px;" });
    experiences.forEach(function (exp, i) {
      var card = el("div", {
        class: "exp-card animate " + animDelay(i + 2) + (selectedIndex === i ? " active" : ""),
        tabindex: "0",
        role: "button",
        onClick: function () { state.expIndex = i; render(); },
        onKeydown: function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); state.expIndex = i; render(); } }
      });
      card.appendChild(el("div", { class: "exp-title" }, [exp.title]));
      card.appendChild(el("div", { class: "exp-sub" }, [exp.company + " \u00b7 " + exp.location]));
      card.appendChild(el("div", { class: "exp-duration" }, [exp.duration]));
      var list = el("ul", { class: "exp-list" });
      exp.description.forEach(function (d) { list.appendChild(el("li", {}, [d])); });
      card.appendChild(list);
      cardsWrap.appendChild(card);
    });
    outer.appendChild(cardsWrap);

    var skillsWrap = el("div", { class: "animate d6" });
    skillsWrap.appendChild(el("div", { class: "sl", style: "margin-bottom:1rem;" }, ["Skills"]));
    var pillRow = el("div", { style: "display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1.5rem;" });
    sel.skills.forEach(function (s) { pillRow.appendChild(el("span", { class: "skill-pill" }, [s])); });
    skillsWrap.appendChild(pillRow);

    if (isVT) {
      var linkCol = el("div", { style: "display:flex;flex-direction:column;gap:8px;margin-top:1rem;max-width:320px;" });
      linkCol.appendChild(el("a", { class: "link-btn", href: "https://aaec.vt.edu/academics/undergraduate/dspg/team/2024.html", target: "_blank", rel: "noopener noreferrer" }, ["Virginia Tech Website \u2197"]));
      linkCol.appendChild(el("a", { class: "link-btn", href: "https://aaec-vt.shinyapps.io/dspg24PrinceGeorge/", target: "_blank", rel: "noopener noreferrer" }, ["R Shiny Web App \u2197"]));
      skillsWrap.appendChild(linkCol);
    }
    outer.appendChild(skillsWrap);

    wrap.appendChild(outer);
    return wrap;
  }

  function renderDataManagerProjects() {
    var wrap = el("div", { class: "page-wrap" });
    wrap.appendChild(backButton(function () { navigate(["projects"]); }));
    wrap.appendChild(el("div", { class: "sl animate d1" }, ["Work Samples"]));
    wrap.appendChild(el("h2", {
      class: "animate d2",
      style: "font-family:var(--serif);font-size:clamp(1.8rem,4vw,2.6rem);font-weight:300;margin-top:0;margin-bottom:0.5rem;color:#ffffff;"
    }, ["Examples of Work"]));
    wrap.appendChild(el("p", {
      class: "animate d3",
      style: "font-family:var(--mono);font-size:13px;color:rgba(255,255,255,0.6);letter-spacing:0.05em;margin-bottom:2.5rem;"
    }, ["* Due to FERPA and other privacy laws, the majority of my work as a Data Analyst is available only to Berea College Faculty."]));

    var list = el("div", { style: "display:flex;flex-direction:column;gap:1px;border:0.5px solid var(--border);border-radius:4px;overflow:hidden;" });
    dataManagerProjects.forEach(function (p, i) {
      var row = el("a", {
        class: "row-link animate " + animDelay(i + 1),
        href: p.link,
        target: "_blank",
        rel: "noopener noreferrer",
        style: i < dataManagerProjects.length - 1 ? "border-bottom:0.5px solid var(--border);" : ""
      });
      row.appendChild(el("span", { class: "row-index" }, [String(i + 1).padStart(2, "0")]));
      var mid = el("div", { style: "flex:1;" });
      mid.appendChild(el("div", { class: "row-title" }, [p.title]));
      mid.appendChild(el("div", { class: "row-desc" }, [p.description]));
      row.appendChild(mid);
      row.appendChild(el("span", { class: "row-arrow" }, ["\u2197"]));
      list.appendChild(row);
    });
    wrap.appendChild(list);
    return wrap;
  }

  function renderPersonalProjects() {
    var wrap = el("div", { class: "page-wrap" });
    wrap.appendChild(backButton(function () { navigate(["projects"]); }));
    wrap.appendChild(el("div", { class: "sl animate d1" }, ["Personal Projects"]));
    wrap.appendChild(el("h2", {
      class: "animate d2",
      style: "font-family:var(--serif);font-size:clamp(1.8rem,4vw,2.6rem);font-weight:300;margin-top:0;margin-bottom:2.5rem;color:#ffffff;"
    }, ["Independent Work"]));

    var grid = el("div", { style: "display:flex;flex-wrap:wrap;gap:12px;" });
    personalProjects.forEach(function (p, i) {
      grid.appendChild(el("a", {
        class: "proj-tile animate " + animDelay(i + 1),
        href: p.link,
        target: "_blank",
        rel: "noopener noreferrer"
      }, [p.label]));
    });
    wrap.appendChild(grid);
    return wrap;
  }

  function renderProjectsMain() {
    var wrap = el("div", {
      class: "page-wrap",
      style: "display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;"
    });
    wrap.appendChild(backButton(function () { navigate([]); }));
    wrap.appendChild(el("div", { class: "sl animate d1", style: "text-align:center;" }, ["03 / Projects"]));
    wrap.appendChild(el("h2", {
      class: "animate d2",
      style: "font-family:var(--serif);font-size:clamp(2rem,5vw,3rem);font-weight:300;margin-top:0;margin-bottom:3rem;color:#ffffff;text-align:center;"
    }, ["Selected Work"]));

    var tilesRow = el("div", { style: "display:flex;gap:16px;flex-wrap:wrap;justify-content:center;" });
    tilesRow.appendChild(el("div", {
      class: "proj-tile animate d3",
      style: "width:240px;height:240px;",
      tabindex: "0",
      role: "button",
      onClick: function () { navigate(["projects", "dataManager"]); },
      onKeydown: function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); navigate(["projects", "dataManager"]); } }
    }, ["Work done as a part of my role as a Data Analyst"]));
    tilesRow.appendChild(el("div", {
      class: "proj-tile animate d4",
      style: "width:240px;height:240px;",
      tabindex: "0",
      role: "button",
      onClick: function () { navigate(["projects", "personal"]); },
      onKeydown: function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); navigate(["projects", "personal"]); } }
    }, ["Personal Projects"]));
    wrap.appendChild(tilesRow);

    return wrap;
  }

  function renderBackground() {
    var wrap = el("div", { class: "page-wrap" });
    wrap.appendChild(backButton(function () { navigate([]); }));

    var aboutSection = el("section", { style: "margin-bottom:4rem;" });
    aboutSection.appendChild(el("div", { class: "sl animate d1" }, ["01 / Background"]));
    aboutSection.appendChild(el("h2", {
      class: "animate d2",
      style: "font-family:var(--serif);font-size:clamp(1.8rem,4vw,2.6rem);font-weight:300;margin-top:0;margin-bottom:2.5rem;color:#ffffff;"
    }, ["About Me"]));

    var aboutOuter = el("div", { style: "display:flex;flex-direction:column;gap:2.5rem;" });

    var photoRow = el("div", { class: "animate d3", style: "display:flex;flex-direction:row;gap:10px;flex-shrink:0;" });
    var photos = [
      { src: "images/photo1.jpg", alt: "Photo 1" },
      { src: "images/photo2.jpg", alt: "Photo 2" }
    ];
    photos.forEach(function (photo, i) {
      var cell = el("div", { class: "photo-cell", style: "width:220px;height:280px;" });
      var img = el("img", { src: photo.src, alt: photo.alt });
      img.addEventListener("error", function () {
        cell.innerHTML = "";
        cell.appendChild(el("div", { class: "ph-fallback" }, ["photo " + (i + 1)]));
      });
      cell.appendChild(img);
      photoRow.appendChild(cell);
    });
    aboutOuter.appendChild(photoRow);

    var bioWrap = el("div", { class: "animate d4", style: "max-width:560px;" });
    bioWrap.appendChild(el("p", {
      style: "font-family:var(--serif);font-size:1.2rem;font-weight:300;line-height:1.9;color:rgba(255,255,255,0.9);margin:0;"
    }, ["I'm a Computer Science graduate from Berea College with a double minor in Philosophy and Law, Ethics, and Society, beginning my Master's in Cybersecurity at Johns Hopkins Whiting School of Engineering in Fall 2026. Originally from Thailand, I moved to the U.S. for college and am fluent in both Thai and English. I specialize in backend development, data analysis, and machine learning, with a strong interest in building full-stack tools that support scientific and educational research. My work blends a solid foundation in statistics and programming with real-world application\u2014particularly through high-impact projects in biomechanics and data visualization. Outside of tech, I'm passionate about running and fitness, and I also work as a personal trainer."]));
    aboutOuter.appendChild(bioWrap);

    aboutSection.appendChild(aboutOuter);
    wrap.appendChild(aboutSection);

    wrap.appendChild(el("div", { class: "divider" }));

    var eduSection = el("section");
    eduSection.appendChild(el("div", { class: "sl animate d1" }, ["02 / Education"]));
    eduSection.appendChild(el("h2", {
      class: "animate d2",
      style: "font-family:var(--serif);font-size:clamp(1.8rem,4vw,2.6rem);font-weight:300;margin-top:0;margin-bottom:2rem;color:#ffffff;"
    }, ["Academic Training"]));

    var eduList = el("div", { style: "display:flex;flex-direction:column;gap:12px;max-width:600px;" });
    educationData.forEach(function (edu, i) {
      var box = el("div", { class: "edu-box animate " + animDelay(i + 2) });
      var row = el("div", { style: "display:flex;gap:1.2rem;align-items:flex-start;" });

      var logoWrap = el("div", { class: "logo-ph" });
      var logoImg = el("img", { src: edu.logo, alt: edu.school + " logo" });
      logoImg.addEventListener("error", function () {
        logoWrap.innerHTML = "";
        logoWrap.appendChild(el("span", {}, ["logo"]));
      });
      logoWrap.appendChild(logoImg);
      row.appendChild(logoWrap);

      var textCol = el("div");
      textCol.appendChild(el("div", { style: "font-family:var(--serif);font-size:1.2rem;font-weight:400;color:#ffffff;margin-bottom:4px;" }, [edu.school]));
      textCol.appendChild(el("div", { style: "font-family:var(--mono);font-size:13px;color:rgba(255,255,255,0.75);margin-bottom:" + (edu.minor ? "3px" : "0") + ";" }, [edu.degree]));
      if (edu.minor) {
        textCol.appendChild(el("div", { style: "font-family:var(--mono);font-size:12px;color:rgba(255,255,255,0.55);margin-bottom:0;" }, [edu.minor]));
      }
      textCol.appendChild(el("div", { class: "pill-date" }, [edu.duration]));
      row.appendChild(textCol);

      box.appendChild(row);
      eduList.appendChild(box);
    });
    eduSection.appendChild(eduList);
    wrap.appendChild(eduSection);

    return wrap;
  }

  function renderPublications() {
    var wrap = el("div", { class: "page-wrap" });
    wrap.appendChild(backButton(function () { navigate([]); }));
    wrap.appendChild(el("div", { class: "sl animate d1" }, ["04 / Publications"]));
    wrap.appendChild(el("h2", {
      class: "animate d2",
      style: "font-family:var(--serif);font-size:clamp(1.8rem,4vw,2.6rem);font-weight:300;margin-top:0;margin-bottom:2.5rem;color:#ffffff;"
    }, ["Published Research"]));

    var citationCard = el("div", { class: "citation-card animate d3" });
    citationCard.appendChild(el("div", { class: "sl", style: "margin-bottom:1rem;" }, ["Citation"]));
    citationCard.appendChild(el("p", {
      style: "font-family:var(--serif);font-size:1.15rem;line-height:1.85;color:rgba(255,255,255,0.9);margin:0;"
    }, [citationText]));
    wrap.appendChild(citationCard);

    var pdfWrap = el("div", { class: "animate d4", style: "max-width:840px;margin:0 auto;" });
    pdfWrap.appendChild(el("div", { class: "sl", style: "margin-bottom:1rem;" }, ["Full Paper"]));
    var frame = el("div", { style: "border:0.5px solid var(--border);border-radius:4px;overflow:hidden;background:rgba(0,0,0,0.3);" });
    var iframe = el("iframe", { src: pdfSrc, title: "Publication PDF", width: "100%", height: "700px", style: "display:block;border:none;" });
    frame.appendChild(iframe);
    pdfWrap.appendChild(frame);

    var dlWrap = el("div", { style: "margin-top:1rem;text-align:center;" });
    dlWrap.appendChild(el("a", { class: "link-btn", href: pdfSrc, download: "", style: "display:inline-block;" }, ["\u2193 Download PDF"]));
    pdfWrap.appendChild(dlWrap);

    wrap.appendChild(pdfWrap);
    return wrap;
  }

  /* ---------------------------------------------------------------- */
  /* Render dispatch                                                    */
  /* ---------------------------------------------------------------- */

  function render() {
    appRoot.innerHTML = "";
    var p = state.path;
    var view;

    if (p.length === 0) view = renderHome();
    else if (p[0] === "experience") view = renderExperience();
    else if (p[0] === "background") view = renderBackground();
    else if (p[0] === "publications") view = renderPublications();
    else if (p[0] === "projects") {
      if (p[1] === "dataManager") view = renderDataManagerProjects();
      else if (p[1] === "personal") view = renderPersonalProjects();
      else view = renderProjectsMain();
    } else view = renderHome();

    appRoot.appendChild(view);
  }

  render();
})();
</script>
</body>
</html>
